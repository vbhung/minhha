<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chan Online</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --bg-0:#050314;
    --bg-1:#0c0726;
    --panel:#0d0a1e;
    --panel-2:#131029;
    --gold:#e8a15c;
    --gold-bright:#ffd39a;
    --accent2:#ff8a65;
    --ink:#fff3e6;
    --ink-dim:#b8a99a;
    --line: rgba(232,161,92,0.35);
  }

  *{ box-sizing:border-box; }
  html{ scroll-padding-top: env(safe-area-inset-top,0px); }

  body{
    margin:0;
    min-height:100%;
    color: var(--ink);
    font-family:'Nunito', system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(232,161,92,0.14), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(255,138,101,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 14px 20px;
    padding-top: calc(14px + env(safe-area-inset-top,0px));
    font-size:.8rem;
    color: var(--ink-dim);
  }

  .status{ display:flex; align-items:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:#4caf50; display:inline-block; box-shadow:0 0 6px #4caf50; }

  .topbar .badge{
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 12px;
    color: var(--gold-bright);
    font-weight:700;
  }

  main{
    max-width: 460px;
    margin: 0 auto;
    padding: 10px 20px 60px;
    text-align:center;
  }

  .frame{
    width: 150px;
    height: 150px;
    margin: 10px auto 18px;
    border: 3px solid var(--gold);
    border-radius: 16px;
    box-shadow:
      0 0 0 4px rgba(0,0,0,0.5),
      0 0 24px rgba(232,161,92,0.55),
      0 0 60px rgba(232,161,92,0.25);
    background: radial-gradient(circle at 50% 35%, #16233a 0%, #060915 75%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 3.4rem;
    position:relative;
    cursor:pointer;
    touch-action: manipulation;
    -webkit-user-select:none;
    user-select:none;
    transition: box-shadow .15s ease;
  }

  .frame:active{
    box-shadow:
      0 0 0 4px rgba(0,0,0,0.5),
      0 0 40px rgba(255,138,101,0.75),
      0 0 90px rgba(255,138,101,0.35);
  }

  .frame.hit{
    animation: glowPulse .5s ease;
  }
  @keyframes glowPulse{
    0%{
      box-shadow: 0 0 0 4px rgba(0,0,0,0.5), 0 0 24px rgba(232,161,92,0.55), 0 0 60px rgba(232,161,92,0.25);
      transform: scale(1);
    }
    35%{
      box-shadow: 0 0 0 4px rgba(0,0,0,0.5), 0 0 60px rgba(255,138,101,0.9), 0 0 120px rgba(255,138,101,0.5);
      transform: scale(1.06);
    }
    100%{
      box-shadow: 0 0 0 4px rgba(0,0,0,0.5), 0 0 24px rgba(232,161,92,0.55), 0 0 60px rgba(232,161,92,0.25);
      transform: scale(1);
    }
  }

  .frame img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 13px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    letter-spacing: .12em;
    font-weight:700;
    font-size: clamp(1.5rem, 6vw, 1.9rem);
    color: var(--gold-bright);
    margin: 4px 0 6px;
  }

  .quote{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-dim);
    margin: 0 0 26px;
    font-size: 1rem;
  }

  .pow{
    position:absolute;
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    color: var(--accent2);
    text-shadow: 0 0 10px rgba(255,138,101,0.85), 0 0 20px rgba(255,138,101,0.5);
    font-size: 1.3rem;
    pointer-events:none;
    animation: pop .65s ease forwards;
    top: -10px;
    left: 50%;
  }
  @keyframes pop{
    0%{ transform: scale(.5); opacity:0; }
    30%{ transform: scale(1.1); opacity:1; }
    100%{ transform: translateY(-46px) scale(1); opacity:0; }
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-top: 22px;
  }

  .panel input{
    width:100%;
    background: var(--bg-0);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-family:'Nunito', sans-serif;
    font-size: .95rem;
    padding: 12px 14px;
    outline:none;
    margin-bottom: 10px;
  }
  .panel input::placeholder{ color: #7a6a55; }
  .panel input:focus{ border-color: var(--gold); }

  .punch-btn{
    width:100%;
    background: linear-gradient(180deg, #0f1f3a, #060c1c);
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    font-weight:800;
    font-size: .95rem;
    letter-spacing:.04em;
    padding: 13px 14px;
    border-radius: 8px;
    cursor:pointer;
    box-shadow: 0 0 14px rgba(232,161,92,0.25);
  }
  .punch-btn:active{ transform: translateY(1px); }
  .punch-btn:disabled{
    color:#5c6b7a;
    border-color: var(--line);
    box-shadow:none;
    cursor:not-allowed;
  }

  .cooldown-note{
    margin-top: 12px;
    background: var(--bg-0);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: .82rem;
    color: var(--ink-dim);
    text-align:left;
    display:none;
  }
  .cooldown-note.show{ display:block; }
  .cooldown-note b{ color: var(--gold-bright); }

  .counter{
    margin-top: 20px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    font-size: .95rem;
    color: var(--ink-dim);
  }
  .counter b{
    color: var(--gold-bright);
    font-size: 1.15rem;
  }

  .recent-title{
    font-family:'Cormorant Garamond', serif;
    letter-spacing:.08em;
    color: var(--gold-bright);
    font-weight:700;
    margin: 26px 0 12px;
  }

  .recent-list{
    list-style:none;
    margin:0; padding:0;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .recent-item{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:.88rem;
  }
  .recent-item .name{ color: var(--ink); font-weight:700; }
  .recent-item .time{ color: var(--ink-dim); font-size:.78rem; }

  .empty{
    color: var(--ink-dim);
    font-size:.85rem;
    padding: 10px 0;
  }

  @media (prefers-color-scheme: light){
    body{ background: linear-gradient(180deg, var(--bg-1), var(--bg-0)); }
  }
</style>
</head>

  const nameInput = document.getElementById('nameInput');
  const punchBtn = document.getElementById('punchBtn');
  const cooldownNote = document.getElementById('cooldownNote');
  const cooldownTime = document.getElementById('cooldownTime');
  const totalCount = document.getElementById('totalCount');
  const recentList = document.getElementById('recentList');

  const faces = ['','','','',''];

  function loadCount(){
    return parseInt(localStorage.getItem(STORAGE_KEY_COUNT) || '0', 10);
  }
  function saveCount(v){
    localStorage.setItem(STORAGE_KEY_COUNT, String(v));
  }
  function loadLog(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY_LOG) || '[]'); }
    catch(e){ return []; }
  }
  function saveLog(log){
    localStorage.setItem(STORAGE_KEY_LOG, JSON.stringify(log.slice(0,8)));
  }

  function renderCount(){
    totalCount.textContent = loadCount();
  }

  function renderLog(){
    const log = loadLog();
    if(!log.length){
      recentList.innerHTML = '<li class="empty">Chưa có ai đấm cả. Bạn đấm đầu tiên đi!</li>';
      return;
    }
    recentList.innerHTML = log.map(item => {
      const mins = Math.max(0, Math.round((Date.now() - item.t)/60000));
      const timeLabel = mins < 1 ? 'vừa xong' : mins + ' phút trước';
      return '<li class="recent-item"><span class="name">'+escapeHtml(item.name)+'</span><span class="time">'+timeLabel+'</span></li>';
    }).join('');
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function pad(n){ return n.toString().padStart(2,'0'); }

  let cooldownTimer = null;
  function tickCooldown(){
    const until = parseInt(localStorage.getItem(STORAGE_KEY_COOLDOWN) || '0', 10);
    const remaining = Math.ceil((until - Date.now())/1000);
    if(remaining > 0){
      punchBtn.disabled = true;
      cooldownNote.classList.add('show');
      const h = Math.floor(remaining/3600);
      const m = Math.floor((remaining%3600)/60);
      const s = remaining%60;
      cooldownTime.textContent = pad(h)+':'+pad(m)+':'+pad(s);
    } else {
      punchBtn.disabled = false;
      cooldownNote.classList.remove('show');
      clearInterval(cooldownTimer);
    }
  }

  function startCooldown(){
    localStorage.setItem(STORAGE_KEY_COOLDOWN, String(Date.now() + COOLDOWN_SECONDS*1000));
    tickCooldown();
    clearInterval(cooldownTimer);
    cooldownTimer = setInterval(tickCooldown, 1000);
  }

  function spawnPow(){
    frameEmoji.textContent = faces[Math.floor(Math.random()*faces.length)];
    const pow = document.createElement('div');
    pow.className = 'pow';
    pow.textContent = 'BÙM!';
    frame.appendChild(pow);
    setTimeout(() => pow.remove(), 650);
    setTimeout(() => { frameEmoji.textContent = ''; }, 500);
  }

  function punch(){
    const until = parseInt(localStorage.getItem(STORAGE_KEY_COOLDOWN) || '0', 10);
    if(Date.now() < until) return;

    const name = nameInput.value.trim() || 'Ẩn danh';

    const count = loadCount() + 1;
    saveCount(count);
    renderCount();

    const log = loadLog();
    log.unshift({ name, t: Date.now() });
    saveLog(log);
    renderLog();

    frame.classList.remove('hit');
    void frame.offsetWidth;
    frame.classList.add('hit');
    spawnPow();

    startCooldown();
  }

  punchBtn.addEventListener('click', punch);
  frame.addEventListener('click', punch);

  renderCount();
  renderLog();
  tickCooldown();
  if(parseInt(localStorage.getItem(STORAGE_KEY_COOLDOWN) || '0', 10) > Date.now()){
    cooldownTimer = setInterval(tickCooldown, 1000);
  }
})();
</script>
</body>
</html>
